<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"
    />
    <meta
      name="description"
      content="FYN Coffee - Premium Coffee Experience. Nikmati kopi berkualitas terbaik."
    />
    <meta name="theme-color" content="#0b0908" />
    <title>FYN Coffee | Premium Coffee Experience</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "Segoe UI",
          "Poppins",
          system-ui,
          -apple-system,
          sans-serif;
        background: #0b0908;
        color: #f5f0eb;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      /* Scrollbar premium */
      ::-webkit-scrollbar {
        width: 5px;
      }
      ::-webkit-scrollbar-track {
        background: #1a1410;
      }
      ::-webkit-scrollbar-thumb {
        background: #d4af37;
        border-radius: 10px;
      }

      /* ========== NAVBAR ========== */
      .navbar {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(11, 9, 8, 0.92);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        padding: 0 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 68px;
        transition: all 0.3s ease;
      }

      /* ========== LOGO BRAND ========== */
      .nav-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        transition: opacity 0.3s;
      }
      .nav-logo:hover {
        opacity: 0.85;
      }

      /* Container gambar logo */
      .logo-img-wrapper {
        position: relative;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        overflow: hidden;
        border: 2px solid #d4af37;
        flex-shrink: 0;
        transition: all 0.3s ease;
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        background: #1a1410;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .nav-logo:hover .logo-img-wrapper {
        box-shadow: 0 0 25px rgba(212, 175, 55, 0.6);
        border-color: #f2c94c;
      }

      /* Gambar logo */
      .logo-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.4s ease;
      }
      .nav-logo:hover .logo-img {
        transform: scale(1.08);
      }

      /* Fallback icon kalau gambar belum ada / error */
      .logo-fallback {
        display: none;
        font-size: 22px;
        color: #d4af37;
      }
      .logo-img.error ~ .logo-fallback,
      .logo-img[src=""].error ~ .logo-fallback,
      .logo-img:not([src]) ~ .logo-fallback {
        display: block;
      }
      .logo-img.error,
      .logo-img[src=""] {
        display: none;
      }

      /* Teks brand */
      .logo-text {
        font-size: 24px;
        font-weight: 900;
        letter-spacing: 5px;
        color: #d4af37;
        text-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        line-height: 1;
      }
      .logo-subtext {
        font-size: 9px;
        letter-spacing: 2px;
        color: #b7a99a;
        font-weight: 400;
        text-transform: uppercase;
        display: block;
        line-height: 1;
      }

      /* Responsif logo */
      @media (max-width: 480px) {
        .logo-img-wrapper {
          width: 34px;
          height: 34px;
          border-width: 1.5px;
        }
        .logo-text {
          font-size: 20px;
          letter-spacing: 3px;
        }
        .logo-subtext {
          font-size: 7px;
          letter-spacing: 1.5px;
        }
        .navbar {
          padding: 0 14px;
          height: 60px;
        }
      }
      @media (max-width: 360px) {
        .logo-img-wrapper {
          width: 30px;
          height: 30px;
        }
        .logo-text {
          font-size: 18px;
        }
        .logo-subtext {
          font-size: 6px;
        }
      }

      /* ========== CART BUTTON ========== */
      .nav-cart-btn {
        position: relative;
        background: none;
        border: none;
        color: #f5f0eb;
        font-size: 24px;
        cursor: pointer;
        padding: 8px;
        transition: 0.3s;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .nav-cart-btn:hover {
        color: #d4af37;
      }
      #cartCount {
        background: #d4af37;
        color: #0b0908;
        font-size: 11px;
        font-weight: 700;
        min-width: 22px;
        height: 22px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        top: 0;
        right: -2px;
        transition: transform 0.2s;
        border: 2px solid #0b0908;
      }
      .cart-label {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      @media (max-width: 480px) {
        .cart-label {
          display: none;
        }
      }

      /* ========== HERO ========== */
      .hero {
        background:
          linear-gradient(
            135deg,
            rgba(0, 0, 0, 0.75) 0%,
            rgba(11, 9, 8, 0.9) 100%
          ),
          url("https://images.unsplash.com/photo-1447933601403-0c6688de566e?auto=format&fit=crop&w=1600&q=80");
        background-size: cover;
        background-position: center 35%;
        padding: 60px 20px 50px;
        text-align: center;
        border-bottom: 1px solid #d4af37;
      }
      .hero-content {
        max-width: 700px;
        margin: 0 auto;
        animation: fadeInUp 0.8s ease;
      }
      .hero h1 {
        font-size: clamp(2.5rem, 8vw, 5rem);
        font-weight: 900;
        letter-spacing: 12px;
        color: #d4af37;
        text-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
        margin-bottom: 10px;
      }
      .hero .tagline {
        font-size: clamp(1rem, 2.5vw, 1.4rem);
        color: #e5d9c6;
        font-weight: 300;
        letter-spacing: 2px;
        margin-bottom: 20px;
      }
      .badge-premium {
        display: inline-block;
        background: rgba(212, 175, 55, 0.1);
        backdrop-filter: blur(8px);
        border: 1px solid #d4af37;
        color: #d4af37;
        padding: 10px 24px;
        border-radius: 30px;
        font-weight: 600;
        font-size: 0.9rem;
        letter-spacing: 1px;
      }
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ========== CONTAINER UTAMA ========== */
      .container {
        max-width: 1000px;
        margin: 0 auto;
        padding: 25px 20px 40px;
      }
      .section-title {
        font-size: 2rem;
        font-weight: 700;
        margin: 20px 0 25px;
        display: flex;
        align-items: center;
        gap: 12px;
        color: #f0e6d2;
        border-left: 4px solid #d4af37;
        padding-left: 18px;
      }
      .section-title i {
        color: #d4af37;
        font-size: 1.6rem;
      }

      /* ========== MENU GRID ========== */
      .menu-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 22px;
        margin-bottom: 30px;
      }
      .card {
        background: #171311;
        border: 1px solid #2b231e;
        border-radius: 24px;
        overflow: hidden;
        transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        display: flex;
        flex-direction: column;
      }
      .card:hover {
        transform: translateY(-8px);
        border-color: #d4af37;
        box-shadow: 0 20px 40px rgba(212, 175, 55, 0.12);
      }
      .card-img {
        position: relative;
        height: 180px;
        overflow: hidden;
      }
      .card-img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s ease;
      }
      .card:hover .card-img img {
        transform: scale(1.06);
      }
      .card-img .icon-badge {
        position: absolute;
        top: 12px;
        right: 12px;
        background: rgba(11, 9, 8, 0.75);
        backdrop-filter: blur(5px);
        color: #d4af37;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
      }
      .card-content {
        padding: 18px 18px 14px;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
      }
      .menu-name {
        font-size: 1.4rem;
        font-weight: 700;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .menu-desc {
        color: #b7a99a;
        font-size: 0.85rem;
        margin-bottom: 10px;
        flex-grow: 1;
      }
      .menu-price {
        font-size: 1.5rem;
        font-weight: 800;
        color: #d4af37;
        margin-bottom: 12px;
      }
      .btn-add {
        background: transparent;
        border: 1.5px solid #d4af37;
        color: #d4af37;
        padding: 10px 16px;
        border-radius: 25px;
        font-weight: 700;
        font-size: 0.9rem;
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        margin-top: auto;
      }
      .btn-add:hover {
        background: #d4af37;
        color: #0b0908;
        box-shadow: 0 6px 18px rgba(212, 175, 55, 0.35);
      }
      .btn-add:active {
        transform: scale(0.96);
      }

      /* ========== FOOTER ========== */
      .footer {
        text-align: center;
        padding: 30px 20px;
        color: #7a6e60;
        border-top: 1px solid #2b231e;
        font-size: 0.9rem;
      }
      .footer span {
        color: #d4af37;
        font-weight: 600;
      }

      /* ========== OVERLAY BACKGROUND ========== */
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        z-index: 200;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.35s ease,
          visibility 0.35s;
      }
      .overlay.active {
        opacity: 1;
        visibility: visible;
      }

      /* ========== CART DRAWER ========== */
      .cart-drawer {
        position: fixed;
        top: 0;
        right: 0;
        width: 100%;
        max-width: 420px;
        height: 100vh;
        height: 100dvh;
        background: #171311;
        z-index: 300;
        transform: translateX(100%);
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        flex-direction: column;
        box-shadow: -8px 0 35px rgba(0, 0, 0, 0.7);
        border-left: 1px solid #2b231e;
      }
      .cart-drawer.open {
        transform: translateX(0);
      }

      .drawer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 20px;
        border-bottom: 1px solid #2b231e;
        background: #0f0c0a;
      }
      .drawer-header h2 {
        font-size: 1.3rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .drawer-close {
        background: none;
        border: none;
        color: #aaa;
        font-size: 22px;
        cursor: pointer;
        padding: 6px;
        transition: 0.2s;
      }
      .drawer-close:hover {
        color: #d4af37;
        transform: rotate(90deg);
      }

      .drawer-body {
        flex: 1;
        overflow-y: auto;
        padding: 15px 20px;
      }
      .empty-cart-msg {
        text-align: center;
        color: #7a6e60;
        padding: 40px 20px;
        font-style: italic;
      }
      .cart-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 0;
        border-bottom: 1px solid #2b231e;
        gap: 10px;
      }
      .item-detail {
        flex: 1;
        min-width: 0;
      }
      .item-name {
        font-weight: 600;
        font-size: 0.95rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .qty-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 5px;
      }
      .qty-btn {
        background: #2b231e;
        border: none;
        color: #d4af37;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
      }
      .qty-btn:hover {
        background: #d4af37;
        color: #0b0908;
      }
      .qty-num {
        min-width: 22px;
        text-align: center;
        font-weight: 700;
      }
      .item-subtotal {
        font-weight: 700;
        color: #d4af37;
        font-size: 1rem;
        white-space: nowrap;
      }
      .btn-remove {
        background: none;
        border: none;
        color: #a08870;
        cursor: pointer;
        font-size: 0.9rem;
        padding: 4px;
        transition: 0.2s;
      }
      .btn-remove:hover {
        color: #e74c3c;
      }

      .drawer-footer {
        border-top: 1px solid #2b231e;
        padding: 16px 20px;
        background: #0f0c0a;
      }
      .note-input {
        width: 100%;
        background: #1a1410;
        border: 1px solid #3a322b;
        border-radius: 14px;
        padding: 12px 14px;
        color: #f5f0eb;
        font-size: 0.9rem;
        resize: vertical;
        margin-bottom: 12px;
        font-family: inherit;
      }
      .note-input::placeholder {
        color: #6b5e52;
      }
      .total-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 1.4rem;
        font-weight: 800;
        margin-bottom: 14px;
      }
      #drawerTotal {
        color: #d4af37;
      }
      .btn-wa {
        background: #25d366;
        border: none;
        padding: 14px;
        width: 100%;
        border-radius: 30px;
        font-weight: 700;
        font-size: 1rem;
        color: white;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: 0.3s;
        letter-spacing: 0.5px;
      }
      .btn-wa:hover {
        background: #1da851;
        box-shadow: 0 8px 22px rgba(37, 211, 102, 0.35);
      }
      .btn-clear {
        background: transparent;
        border: 1px solid #5c4a3a;
        color: #b7a99a;
        padding: 10px;
        width: 100%;
        border-radius: 25px;
        font-size: 0.8rem;
        cursor: pointer;
        margin-top: 8px;
        transition: 0.2s;
      }
      .btn-clear:hover {
        border-color: #d4af37;
        color: #d4af37;
      }

      /* ========== FAB ========== */
      .fab-cart {
        display: none;
        position: fixed;
        bottom: 25px;
        right: 20px;
        z-index: 150;
        background: #d4af37;
        color: #0b0908;
        width: 55px;
        height: 55px;
        border-radius: 50%;
        border: none;
        font-size: 22px;
        cursor: pointer;
        box-shadow: 0 8px 25px rgba(212, 175, 55, 0.45);
        transition: 0.3s;
        align-items: center;
        justify-content: center;
      }
      .fab-cart:hover {
        transform: scale(1.08);
        box-shadow: 0 12px 30px rgba(212, 175, 55, 0.6);
      }
      .fab-cart .badge {
        position: absolute;
        top: -4px;
        right: -4px;
        background: #c0392b;
        color: white;
        font-size: 11px;
        font-weight: 700;
        min-width: 22px;
        height: 22px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      @media (max-width: 768px) {
        .fab-cart {
          display: flex;
        }
        .nav-cart-btn {
          display: none;
        }
      }
      @media (max-width: 480px) {
        .cart-drawer {
          max-width: 100%;
        }
        .card-img {
          height: 160px;
        }
        .section-title {
          font-size: 1.6rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- ==================== NAVBAR ==================== -->
    <nav class="navbar">
      <!-- LOGO BRAND DENGAN GAMBAR -->
      <a href="#" class="nav-logo" aria-label="FYN Coffee Home">
        <div class="logo-img-wrapper">
          <img
            src="Logo Primary Mentahan (HD).jpg"
            alt="FYN Coffee Logo"
            class="logo-img"
            onerror="this.classList.add('error')"
            loading="eager"
          />
          <i class="fas fa-mug-hot logo-fallback"></i>
        </div>
        <div>
          <span class="logo-text">FYN</span>
          <span class="logo-subtext">Premium Coffee</span>
        </div>
      </a>

      <button class="nav-cart-btn" id="navCartBtn" aria-label="Buka keranjang">
        <i class="fas fa-shopping-bag"></i>
        <span id="cartCount">0</span>
        <span class="cart-label">Keranjang</span>
      </button>
    </nav>

    <!-- ==================== HERO ==================== -->
    <header class="hero">
      <div class="hero-content">
        <h1>FYN</h1>
        <p class="tagline">Premium Coffee Experience</p>
        <div class="badge-premium">
          <i class="fas fa-star"></i> Kopi Berkualitas • Setiap Hari
        </div>
      </div>
    </header>

    <!-- ==================== KONTEN UTAMA ==================== -->
    <main class="container">
      <h2 class="section-title">
        <i class="fas fa-coffee"></i> Menu Signature
      </h2>
      <div class="menu-grid" id="menuGrid">
        <!-- Dirender oleh JavaScript -->
      </div>
    </main>

    <!-- ==================== FOOTER ==================== -->
    <footer class="footer">
      <span>FYN Coffee</span> © 2026 • Premium Coffee Experience <br />
      <small>
        Dibuat dengan <i class="fas fa-heart" style="color: #d4af37"></i> untuk
        pencinta kopi
      </small>
    </footer>

    <!-- ==================== OVERLAY ==================== -->
    <div class="overlay" id="overlay"></div>

    <!-- ==================== CART DRAWER ==================== -->
    <div class="cart-drawer" id="cartDrawer">
      <div class="drawer-header">
        <h2><i class="fas fa-shopping-cart"></i> Keranjang</h2>
        <button
          class="drawer-close"
          id="drawerClose"
          aria-label="Tutup keranjang"
        >
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="drawer-body" id="drawerBody">
        <div class="empty-cart-msg">
          <i
            class="far fa-coffee-bean"
            style="font-size: 2rem; display: block; margin-bottom: 10px"
          ></i>
          Keranjang masih kosong.<br />Tambahkan kopi pilihanmu.
        </div>
      </div>
      <div class="drawer-footer">
        <textarea
          id="noteInput"
          class="note-input"
          placeholder="✨ Catatan pesanan (contoh: less sugar, extra shot)"
        ></textarea>
        <div class="total-row">
          <span>Total</span>
          <span id="drawerTotal">Rp 0</span>
        </div>
        <button class="btn-wa" id="btnWhatsApp">
          <i class="fab fa-whatsapp"></i> Pesan via WhatsApp
        </button>
        <button class="btn-clear" id="btnClearCart">
          <i class="far fa-trash-alt"></i> Kosongkan Keranjang
        </button>
      </div>
    </div>

    <!-- ==================== FAB MOBILE ==================== -->
    <button class="fab-cart" id="fabCart" aria-label="Keranjang">
      <i class="fas fa-shopping-bag"></i>
      <span class="badge" id="fabBadge">0</span>
    </button>

    <script>
      (function () {
        // ========== DATA MENU ==========
        const menuItems = [
          {
            id: "coffee-milk",
            name: "Signature Coffee Milk",
            icon: "🥛",
            desc: "Espresso creamy dengan susu pilihan terbaik.",
            price: 12000,
            image: "menu latte.png",
          },
          {
            id: "americano",
            name: "Americano",
            icon: "☕",
            desc: "Strong coffee untuk pecinta rasa autentik.",
            price: 8000,
            image: "amer.png",
          },
        ];

        // ========== STATE ==========
        let cart = JSON.parse(localStorage.getItem("fynCartDrawer")) || [];

        // ========== DOM ELEMENTS ==========
        const menuGrid = document.getElementById("menuGrid");
        const drawerBody = document.getElementById("drawerBody");
        const drawerTotal = document.getElementById("drawerTotal");
        const cartCountSpan = document.getElementById("cartCount");
        const fabBadge = document.getElementById("fabBadge");
        const noteInput = document.getElementById("noteInput");
        const cartDrawer = document.getElementById("cartDrawer");
        const overlay = document.getElementById("overlay");
        const drawerClose = document.getElementById("drawerClose");
        const navCartBtn = document.getElementById("navCartBtn");
        const fabCart = document.getElementById("fabCart");
        const btnWhatsApp = document.getElementById("btnWhatsApp");
        const btnClearCart = document.getElementById("btnClearCart");

        function saveCart() {
          localStorage.setItem("fynCartDrawer", JSON.stringify(cart));
        }

        function updateBadges() {
          const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
          cartCountSpan.textContent = totalItems;
          fabBadge.textContent = totalItems;
          cartCountSpan.style.transform = "scale(1.3)";
          fabBadge.style.transform = "scale(1.3)";
          setTimeout(() => {
            cartCountSpan.style.transform = "scale(1)";
            fabBadge.style.transform = "scale(1)";
          }, 150);
        }

        function openDrawer() {
          cartDrawer.classList.add("open");
          overlay.classList.add("active");
          document.body.style.overflow = "hidden";
        }

        function closeDrawer() {
          cartDrawer.classList.remove("open");
          overlay.classList.remove("active");
          document.body.style.overflow = "";
        }

        function addToCart(id, name, price) {
          const existing = cart.find((item) => item.id === id);
          if (existing) {
            existing.qty += 1;
          } else {
            cart.push({ id, name, price, qty: 1 });
          }
          saveCart();
          renderDrawer();
          updateBadges();
          openDrawer();
        }

        function changeQty(index, delta) {
          if (index < 0 || index >= cart.length) return;
          cart[index].qty += delta;
          if (cart[index].qty <= 0) {
            cart.splice(index, 1);
          }
          saveCart();
          renderDrawer();
          updateBadges();
        }

        function removeItem(index) {
          if (index >= 0 && index < cart.length) {
            cart.splice(index, 1);
            saveCart();
            renderDrawer();
            updateBadges();
          }
        }

        function clearCart() {
          if (cart.length === 0) return;
          if (confirm("Yakin ingin mengosongkan keranjang?")) {
            cart = [];
            saveCart();
            renderDrawer();
            updateBadges();
          }
        }

        function renderMenu() {
          menuGrid.innerHTML = menuItems
            .map(
              (item) => `
          <div class="card">
            <div class="card-img">
              <img src="${item.image}" alt="${item.name}" loading="lazy" />
              <div class="icon-badge"><i class="fas fa-mug-hot"></i></div>
            </div>
            <div class="card-content">
              <div class="menu-name">${item.icon} ${item.name}</div>
              <div class="menu-desc">${item.desc}</div>
              <div class="menu-price">Rp ${item.price.toLocaleString("id-ID")}</div>
              <button class="btn-add" data-id="${item.id}" data-name="${item.name}" data-price="${item.price}">
                <i class="fas fa-plus-circle"></i> Tambah
              </button>
            </div>
          </div>
        `,
            )
            .join("");

          document.querySelectorAll(".btn-add").forEach((btn) => {
            btn.addEventListener("click", function () {
              const id = this.dataset.id;
              const name = this.dataset.name;
              const price = parseInt(this.dataset.price);
              addToCart(id, name, price);
            });
          });
        }

        function renderDrawer() {
          if (cart.length === 0) {
            drawerBody.innerHTML = `
            <div class="empty-cart-msg">
              <i class="far fa-coffee-bean" style="font-size:2.5rem; display:block; margin-bottom:12px;"></i>
              Keranjang masih kosong.<br><small>Tambahkan kopi pilihanmu.</small>
            </div>`;
            drawerTotal.textContent = "Rp 0";
            updateBadges();
            return;
          }

          let total = 0;
          drawerBody.innerHTML = cart
            .map((item, index) => {
              const subtotal = item.price * item.qty;
              total += subtotal;
              return `
            <div class="cart-item">
              <div class="item-detail">
                <div class="item-name">${item.name}</div>
                <div class="qty-row">
                  <button class="qty-btn" data-index="${index}" data-delta="-1">−</button>
                  <span class="qty-num">${item.qty}</span>
                  <button class="qty-btn" data-index="${index}" data-delta="1">+</button>
                </div>
              </div>
              <div class="item-subtotal">Rp ${subtotal.toLocaleString("id-ID")}</div>
              <button class="btn-remove" data-index="${index}" title="Hapus">
                <i class="fas fa-trash-alt"></i>
              </button>
            </div>
          `;
            })
            .join("");

          drawerTotal.textContent = `Rp ${total.toLocaleString("id-ID")}`;
          updateBadges();

          drawerBody.querySelectorAll(".qty-btn").forEach((btn) => {
            btn.addEventListener("click", function (e) {
              e.stopPropagation();
              const index = parseInt(this.dataset.index);
              const delta = parseInt(this.dataset.delta);
              changeQty(index, delta);
            });
          });
          drawerBody.querySelectorAll(".btn-remove").forEach((btn) => {
            btn.addEventListener("click", function (e) {
              e.stopPropagation();
              const index = parseInt(this.dataset.index);
              removeItem(index);
            });
          });
        }

        function sendWhatsApp() {
          if (cart.length === 0) {
            alert("💡 Silakan tambahkan minimal satu menu ke keranjang.");
            return;
          }
          const phoneNumber = "6281269441924";
          let message = "☕*Halo FYN Coffee!* %0A%0A";
          message += "Saya ingin memesan:%0A";
          cart.forEach((item) => {
            message += `➤ ${item.name} x${item.qty}%0A`;
          });
          const totalText = drawerTotal.textContent.replace("Rp ", "");
          message += `%0A💰 *Total: Rp ${totalText}*`;
          const note = noteInput.value.trim();
          if (note) {
            message += `%0A📝 *Catatan:* ${note}`;
          }
          message += "%0A%0A✨ Terima kasih! %0A_Segera diproses._";
          window.open(`https://wa.me/${phoneNumber}?text=${message}`, "_blank");
        }

        // ========== EVENT LISTENERS ==========
        navCartBtn.addEventListener("click", openDrawer);
        fabCart.addEventListener("click", openDrawer);
        drawerClose.addEventListener("click", closeDrawer);
        overlay.addEventListener("click", closeDrawer);
        btnWhatsApp.addEventListener("click", sendWhatsApp);
        btnClearCart.addEventListener("click", clearCart);
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && cartDrawer.classList.contains("open")) {
            closeDrawer();
          }
        });

        const savedNote = localStorage.getItem("fynNoteDrawer");
        if (savedNote) noteInput.value = savedNote;
        noteInput.addEventListener("input", () => {
          localStorage.setItem("fynNoteDrawer", noteInput.value);
        });

        // ========== INIT ==========
        renderMenu();
        renderDrawer();
        updateBadges();
      })();
    </script>
  </body>
</html>
